name: Release desktop

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    uses: michael-borck/actions/.github/workflows/tauri-release.yml@main
    secrets: inherit
    with:
      product-name: Limn
      preflight-command: ''
      install-command: npm install --no-audit --no-fund
      cache: ''
      updater: false
