# Shared release pipeline: michael-borck/app-hq/.github/workflows/tauri-release.yml
name: Release desktop

on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    uses: michael-borck/app-hq/.github/workflows/tauri-release.yml@main
    with:
      product-name: Limn
      project-path: desktop
      tauri-script: npx --yes @tauri-apps/cli@^2
      install-command: ''
      cache: ''
      preflight-command: ''
      release-body: |
        Limn desktop — privacy-first text-to-image, bring your own provider.

        First launch downloads a private Python runtime (~1 min), then configure
        your provider in Settings. Nothing leaves your machine except generation
        requests to the provider you set.
      updater: false
    secrets:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
